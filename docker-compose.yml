services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Chrxnxs08}
      POSTGRES_DB: ${POSTGRES_DB:-news_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-nep

  swt-intern-nep-engine:
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Chrxnxs08}
      POSTGRES_DB: ${POSTGRES_DB:-news_db}
    depends_on:
      - db
    networks:
      - network-nep

  swt-intern-nep-webapp:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "26109:80"
    depends_on:
      - swt-intern-nep-engine
    networks:
      - network-nep

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab_runner_config:/etc/gitlab-runner
    networks:
      - network-nep

networks:
  network-nep:
    driver: bridge

volumes:
  postgres_data:
  gitlab_runner_config:
