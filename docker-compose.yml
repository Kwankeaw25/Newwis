services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Chrxnxs08}
      POSTGRES_DB: ${POSTGRES_DB:-news_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Chrxnxs08}
      POSTGRES_DB: ${POSTGRES_DB:-news_db}
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html
    depends_on:
      - api

volumes:
  postgres_data:
